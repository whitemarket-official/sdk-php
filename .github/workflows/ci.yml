name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Makefile runs Composer and pcov in Docker locally; on the runner setup-php provides both.
  COMPOSER_BIN: composer
  PHP_COV: php

jobs:
  static:
    name: Static checks (fmt, lint, rector, phpstan, codegen, generator tests, audit, deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.11.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-static-${{ hashFiles('composer.lock', 'tools/infection/composer.lock') }}
      - run: make install
      - run: make fmt-check lint stan test-codegen codegen-check audit deps VERBOSE=1

  tests:
    name: Tests (PHP ${{ matrix.php }}${{ matrix.php == '8.5' && ', coverage gate' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:2.11.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-tests-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress
      # The coverage gate runs once, on the tools PHP version (Makefile "check"); the other versions run the tests.
      - run: make ${{ matrix.php == '8.5' && 'coverage' || 'test' }} VERBOSE=1

  # A pull request mutates only its added and modified lines of src/ (minutes); push to main and manual runs mutate
  # everything (about 35 min on a 3-thread runner, 4000+ mutants) and enforce the MSI thresholds of infection.json5.
  mutation:
    name: Mutation tests (Infection)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed-lines run diffs against the base branch, which needs the history.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:2.11.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-mutation-${{ hashFiles('composer.lock', 'tools/infection/composer.lock') }}
      - run: make install
      - name: make infection
        env:
          # Pull requests target main; a fixed base keeps branch names out of the command line.
          INFECTION_ARGS: >-
            ${{ github.event_name == 'pull_request'
            && '--git-diff-lines --git-diff-base=origin/main --ignore-msi-with-no-mutations'
            || '' }}
        run: make infection VERBOSE=1

  repo-hygiene:
    name: Secret scan, workflow lint, agent hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make secrets-scan VERBOSE=1
      - run: make actionlint VERBOSE=1
      - run: make hooks-test

  # Single required status check for the branch ruleset: green only when every job above is green.
  ci-ok:
    name: CI OK
    if: always()
    needs: [static, tests, mutation, repo-hygiene]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
