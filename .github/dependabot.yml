# Keys checked against https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# (2026-11-01). Dependency changes still go through review and the ADR rule (CLAUDE.md rule 10).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      composer-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /tools/infection
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      infection-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
