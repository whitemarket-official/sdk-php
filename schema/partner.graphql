  CONTRABAND
  DEFAULT_WEAPON
  LEGENDARY
  LEGENDARY_CHARACTER
  LEGENDARY_WEAPON
  MYTHICAL
  MYTHICAL_CHARACTER
  MYTHICAL_WEAPON
  RARE
  RARE_CHARACTER
  RARE_WEAPON
  UNCOMMON_WEAPON
}

"""An item that a case or capsule can drop"""
type CSGOSteamContainItem {
  """
  Item icon, resized to width and height when given @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/default_generated/weapon_ak47_cu_ak47_rubber_light_large.5836c38d3037a5a1f90ffdc8c9d0b94367ca8efd.png
  """
  icon(height: Int, width: Int): String!

  """
  Item name as shown in game @example Sealed Graffiti | Loser (SWAT Blue)
  """
  name: String!

  """Rarity grade of the item, null when the catalog has none"""
  rarityEnum: CSGORarity
}

"""Item description shared by every copy with the same name hash"""
type CSGOSteamItem implements SteamItemInterface {
  """The ID of the app which owns the item @example 730"""
  appId: String!

  """Catalog section the item is filed under, localized"""
  category: LocalizedValue! @deprecated(reason: "Use categoryEnum instead")

  """Catalog section, OTHER when the item fits none"""
  categoryEnum: CSGOCategory!

  """Catalog section name in the requested locale @example Knives"""
  categoryTitle: String!

  """
  Icon of the attached charm, empty string when there is none @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/charms/usp_jewel_0_large.0310a91ffcbe6720557e12e0e8b7352dd8576774.png
  """
  charmImage: String!

  """Cheapest listing on the market carrying the same charm"""
  charmMinPrice: Money

  """
  Title of the attached charm, empty string when there is none @example Charm | Glamour Shot
  """
  charmTitle: String!

  """
  Steam class id; with instanceId it forms the item ACI id @example 5568220466
  """
  classId: String!

  """Skin collection or case the item comes from, localized"""
  collection: LocalizedValue

  """Common items this case can drop, with icon and rarity"""
  containItems: [CSGOSteamContainItem!]!

  """Rare special items this case can drop, with icon and rarity"""
  containRareItems: [CSGOSteamContainItem!]!

  """
  Names of the common items this case can drop @example ["AK-47 | Redline"]
  """
  contains: [String!]! @deprecated(reason: "Use containItems instead")

  """
  Names of the rare special items this case can drop @example ["★ Karambit | Doppler"]
  """
  containsRare: [String!]! @deprecated(reason: "Use containRareItems instead")

  """
  Flavour text Steam prints on the item @example It is said the Loser graffiti was born in a lost bet.
  """
  description: String

  """Wear grade from the Steam tag, null for items without wear"""
  exterior: LocalizedValue

  """
  Item icon, resized to width and height when given @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/default_generated/weapon_ak47_cu_ak47_rubber_light_large.5836c38d3037a5a1f90ffdc8c9d0b94367ca8efd.png
  """
  icon(height: Int, width: Int): String

  """
  Larger item icon, resized to width and height when given @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/default_generated/weapon_ak47_cu_ak47_rubber_light_large.5836c38d3037a5a1f90ffdc8c9d0b94367ca8efd.png
  """
  iconLarge(height: Int, width: Int): String

  """
  Steam instance id; with classId it forms the item ACI id @example 188530139
  """
  instanceId: String!

  """Whether Steam allows selling the item, always true now @example true"""
  isMarketable: Boolean! @deprecated(reason: "Please do not use it")

  """Whether the item is a Souvenir tournament drop @example false"""
  isSouvenir: Boolean!

  """Whether the weapon counts kills with a StatTrak module @example true"""
  isStatTrak: Boolean!

  """Whether Steam currently allows trading the item @example true"""
  isTradeable: Boolean!

  """Days the item stays untradable after a market sale @example 7"""
  marketTradeableRestriction: Int!

  """Display name of the item @example Sealed Graffiti | Loser (SWAT Blue)"""
  name: String!

  """
  Steam market name, identifies the item listing page @example Sealed Graffiti | Loser (SWAT Blue)
  """
  nameHash: String!

  """Rarity grade from the Steam tag, localized"""
  rarity: LocalizedValue

  """
  Weapon part of the name, before the bar, localized @example Souvenir Five-SeveN
  """
  short: String

  """
  Weapon part of the name in English, whatever the locale @example Souvenir Five-SeveN
  """
  shortEn: String

  """Skin part of the name, after the bar, localized @example Contractor"""
  skin: String

  """
  Skin part of the name in English, whatever the locale @example Contractor
  """
  skinEn: String

  """Last known Steam market price, null when Steam has none"""
  steamPrice: Money

  """
  Icons of applied stickers, copied from Steam tags @example ["https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png"]
  """
  stickerImages: [String!]! @deprecated(reason: "Please do not use it")

  """
  Titles of applied stickers joined by comma @example Sticker | floppy | Paris 2023 , Sticker | s1mple | Katowice 2019
  """
  stickerTitles: String! @deprecated(reason: "Please do not use it")

  """Catalog subsection the item is filed under, localized"""
  subcategory: LocalizedValue! @deprecated(reason: "Use subcategoryEnum instead")

  """Catalog subsection, null when the model is unknown"""
  subcategoryEnum: CSGOSubcategory

  """Catalog subsection name in the requested locale @example Bayonet"""
  subcategoryTitle: String

  """Weapon model from the Steam tag, localized"""
  subtype: LocalizedValue @deprecated(reason: "Use subtypeEnum instead")

  """Weapon model, null when Steam sends no model tag"""
  subtypeEnum: CSGOSubtype

  """Weapon class from the Steam tag, localized"""
  type: LocalizedValue! @deprecated(reason: "Use typeEnum instead")

  """Weapon class, null when Steam sends no type tag"""
  typeEnum: CSGOType

  """
  When this description was last refreshed from Steam @example 2023-11-29T23:33:27+0000
  """
  updatedAt: DateTime!
}

"""A sticker applied to a weapon, with its wear and position"""
type CSGOSticker {
  """Finish of the sticker, null for the plain paper one @example HOLO"""
  film: CSGOStickerFilm

  """
  Icon of the sticker @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
  """
  icon(height: Int, width: Int): String

  """Cheapest listing of this sticker as a standalone item"""
  minPrice: Money

  """Catalog key of the sticker @example paris2023_signature_floppy_4"""
  name: String!

  """
  Sticker position X offset on the weapon, null when unknown @example -0.1875
  """
  offsetX: String

  """
  Sticker position Y offset on the weapon, null when unknown @example 0.0625
  """
  offsetY: String

  """Display title of the sticker @example Sticker | floppy | Paris 2023"""
  title: String!

  """
  Sticker scrape wear from 0 (pristine) to 1 (fully scraped), null when unknown @example 0.57
  """
  wear: String
}

