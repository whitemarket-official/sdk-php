type WalletDeposit {
  """
  Client secret to confirm the payment intent in the Airwallex SDK @example int_0abc1def2ghi3jkl4mn_secret_0aBc1dEf2gHi
  """
  airwallexSecret: String

  """Amount credited to the balance once the deposit succeeds"""
  amount: Money!

  """
  Note explaining the current status, usually a decline reason @example Payment declined by the issuer
  """
  comment: String

  """
  When the money landed; set only for a successful deposit @example 2023-11-29T23:33:27+0000
  """
  completedAt: DateTime

  """When the top-up was started @example 2023-11-29T23:33:27+0000"""
  createdAt: DateTime!

  """
  When the payment link or address stops being valid @example 2023-11-29T23:33:27+0000
  """
  expiredAt: DateTime

  """Deposit ID @example 1edee7b6-115c-6baa-a499-0242ac1d003d"""
  id: String!

  """Amount to transfer in the card currency (BANK_CARD)"""
  paymentAmount: ProviderMoney

  """User topping up the balance"""
  person: PersonPublic!

  """Payment provider handling the top-up @example WHITEBIT"""
  provider: PaymentProvider!

  """
  Provider's own reference: a transaction ID, or a wallet address for crypto @example bc1qnnxkvn2ht4n5uyqsjguq9d4cuqgghyuzychpju
  """
  providerCorrespondingId: String

  """
  Provider checkout page to send the user to @example https://checkout.whitebit.com/pay/8f3c1a2e
  """
  providerPaymentPage: String

  """
  Where the top-up stands with the provider: pending, settled or failed @example SUCCESS
  """
  status: WalletDepositStatus!
}

enum WalletDepositStatus {
  BLOCKED
  EXPIRED
  FAILED
  NEW
  PROCESSING
  SUCCESS
  UNCREDITED
}

enum WalletMethodEnum {
  AIRWALLEX
  BANK_CARD
  C4S
  DIFMARK
  DRIFFLE
  ENEBA
  ESEA
  G2A
  GAMESEAL
  INTERNAL
  KINGUIN
  LIKECARD
  MERCURYO
  NUVEI
  OFFGAMERS
  PAYOP
  PAYPAL
  PAYSERA
  SEAGM
  SEPA
  SKINSBACK
  SOLIDGATE
  TIPALTI
  WHITEBIT
  WHITEBIT_CODE
  WHITEPAY
  ZEN
}

"""A single movement of money in or out of a WhiteMarket balance"""
type WalletTransaction {
  """Amount the balance moved by, negative when money left it"""
  amount: Money!

  """
  Note attached to the movement; currently filled for withdrawals only @example Payout to card
  """
  comment: String

  """The other party of the transfer; null when there is none"""
  counterparty: PersonPublic

  """When the transaction was recorded @example 2023-11-29T23:33:27+0000"""
  createdAt: DateTime!

  """Fee taken on top of the amount; null when nothing was charged"""
  fee: Money

  """Transaction ID @example 1ed4bd11-0a0e-658a-9e45-0242ac1d0004"""
  id: String!

  """Currency the user paid or received in, before conversion @example USD"""
  initialCurrency: CryptoCurrency

  """
  Which side of the deal the user was on, for deal-related movements @example BUY
  """
  marketDealActionType: MarketDealActionType

  """Payment method the money went through @example WHITEBIT"""
  method: WalletMethodEnum

  """Blockchain network the crypto transfer used @example TRC20"""
  network: CryptoNetwork

  """User whose balance moved"""
  person: PersonPublic!

  """
  What caused the movement, such as a deal or a payout @example MARKET_PRODUCT
  """
  reason: WalletTransactionReason!

  """
  ID of the deal, deposit or withdrawal named by reason @example 1ed4bd11-0a0e-658a-9e45-0242ac1d0004
  """
  reasonId: String!

  """
  Where the transaction stands: pending, settled or failed @example SUCCESS
  """
  status: WalletTransactionStatus!

  """
  Withdrawal destination address or wallet @example TMeDeibY2ovqARyVh3H9wGVHX7ixmujKcW
  """
  withdrawalAddress: String
}

"""Page of wallet transactions with cursors to walk the list"""
type WalletTransactionConnection {
  """Edges of the connection"""
  edges: [WalletTransactionConnectionEdge]

  """Page info of the connection"""
  pageInfo: PageInfo

  """Total count of items in the connection."""
  totalCount: Int
}

type WalletTransactionConnectionEdge {
  """The edge cursor"""
  cursor: String!

  """Node of the Edge"""
  node: WalletTransaction
}

enum WalletTransactionFeeType {
  BONUS
  DEPOSIT
  INTERNAL
  MARKET_PRODUCT
  WITHDRAWAL
}

enum WalletTransactionReason {
  BONUS
  DEPOSIT
  GIFT_CARD_PURCHASE
  INSTANT_EXCHANGE
  INSTANT_EXCHANGE_HOLD_RELEASE_IN
  INSTANT_EXCHANGE_HOLD_RELEASE_OUT
  INSTANT_EXCHANGE_REFUND_IN
  INSTANT_EXCHANGE_REFUND_OUT
  INSTANT_EXCHANGE_TRANSFER_IN
  INSTANT_EXCHANGE_TRANSFER_OUT
  INTERNAL
  MARKET_OFFER_HOLD
  MARKET_PRODUCT
  REVERSE_PENALTY
  REVERSE_REFUND
  TRANSFER
  WITHDRAWAL
  WRITE_OFF
}

"""
Filters and sorting for your balance history. Omitted fields impose no restriction
"""
input WalletTransactionSearchInput {
  """Keep movements recorded inside this time range"""
  createdAt: DateTimeRangeInput

  """Keep movements recorded in this currency @example USD"""
  currency: Currency

  """Keep only fees charged for this kind of event @example WITHDRAWAL"""
  feeType: WalletTransactionFeeType

  """Keep top-ups the user paid in any of these currencies @example [USDT]"""
  initialCurrencyDeposit: [Currency!]

  """
  Keep cash-outs the user received in any of these currencies @example [USDT]
  """
  initialCurrencyWithdrawal: [Currency!]

  """Keep deal movements where you were the buyer @example true"""
  isBuyer: Boolean

  """Keep deal movements where you were the seller @example true"""
  isSeller: Boolean

  """Keep movements caused by this kind of event @example DEPOSIT"""
  reason: WalletTransactionReason

  """
  Keep movements caused by any of these kinds of event @example [DEPOSIT]
  """
  reasons: [WalletTransactionReason!]

  """Field and direction to order the result by"""
  sort: WalletTransactionSortInput

  """Keep movements at this settlement state @example SUCCESS"""
  status: WalletTransactionStatus

  """Keep top-ups made through any of these methods @example ["whitebit"]"""
  walletMethodsDeposit: [String!]

  """Keep cash-outs made through any of these methods @example ["tipalti"]"""
  walletMethodsWithdrawal: [String!]
}

enum WalletTransactionSortField {
  AMOUNT
  CREATED_AT
}

"""Ordering rule for the wallet transaction list"""
input WalletTransactionSortInput {
  """Transaction field the list is ordered by"""
  field: WalletTransactionSortField!

  """Ascending or descending order"""
  type: SortType!
}

enum WalletTransactionStatus {
  CANCELED
  HOLD_INCOME
  HOLD_OUTCOME
  SUCCESS
  SUCCESS_HOLD
}

"""Money sent from one user wallet to another"""
type WalletTransfer {
  """Money moved by this transfer"""
  amount: Money!

  """Note the sender left for the recipient @example Thanks for the trade"""
  comment: String

  """
  When the money landed, null until it does @example 2023-11-29T23:33:27+0000
  """
  completedAt: DateTime

  """When the transfer was started @example 2023-11-29T23:33:27+0000"""
  createdAt: DateTime!

  """User the money is sent from"""
  from: PersonPublic!

  """Transfer id @example 1edee7b6-115c-6baa-a499-0242ac1d003d"""
  id: String!

  """Where the transfer stands: pending, done or rejected"""
  status: WalletTransferStatus!

  """User the money is sent to"""
  to: PersonPublic!
}

"""Page of transfers with cursors to walk the list"""
type WalletTransferConnection {
  """Edges of the connection"""
  edges: [WalletTransferConnectionEdge]

  """Page info of the connection"""
  pageInfo: PageInfo

  """Total count of items in the connection."""
  totalCount: Int
}

type WalletTransferConnectionEdge {
  """The edge cursor"""
  cursor: String!

  """Node of the Edge"""
  node: WalletTransfer
}

enum WalletTransferStatus {
  CANCELLED
  NEW
  PROCESSING
  SUCCESS
}

"""Payout of wallet money to an external account"""
type WalletWithdrawal {
  """Money taken out of the wallet"""
  amount: Money!

  """
  Note from support explaining the current status @example Rejected by the provider
  """
  comment: String

  """
  When the provider confirmed the payout, null until then @example 2023-11-29T23:33:27+0000
  """
  completedAt: DateTime

  """When the payout was requested @example 2023-11-29T23:33:27+0000"""
  createdAt: DateTime!

  """
  When the unconfirmed payout is dropped @example 2023-11-29T23:33:27+0000
  """
  expiredAt: DateTime

  """Withdrawal id @example 1edfdf7f-c98f-6904-972c-0242ac1d0005"""
  id: String!

  """User taking the money out"""
  person: PersonPublic!

  """Provider the money is paid out through @example WHITEBIT"""
  provider: PaymentProvider!

  """
  Provider transaction id, or the wallet address for crypto @example TMeDeibY2ovqARyVh3H9wGVHX7ixmujKcW
  """
  providerCorrespondingId: String

  """Where the payout stands, from new to paid or rejected"""
  status: WalletWithdrawalStatus!
}

enum WalletWithdrawalStatus {
  EXPIRED
  FAILED
  NEW
  PROCESSING
  SUCCESS
}
