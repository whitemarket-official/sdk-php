}

"""Money range"""
input DecimalNotNullRangeInput {
  """From @example 1.23"""
  from: String!

  """To @example 2.34"""
  to: String!
}

enum DeliveryPromise {
  """Seller promises delivery or cancel in less than 1 hour"""
  HOUR1

  """Seller promises delivery or cancel in less than 12 hours"""
  HOURS12

