type CSGOSticker {
  """Film of sticker @example HOLO"""
  film: CSGOStickerFilm

  """
  Image of sticker @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
  """
  icon(height: Int, width: Int): String

  """Sticker min price"""
  minPrice: Money

  """Mnemonic name of sticker @example paris2023_signature_floppy_4"""
  name: String!

  """
  Sticker position X offset on the weapon, null when unknown @example -0.1875
  """
  offsetX: String

  """
  Sticker position Y offset on the weapon, null when unknown @example 0.0625
  """
  offsetY: String

  """Title of sticker @example Sticker | floppy | Paris 2023"""
  title: String!

  """
  Sticker scrape wear from 0 (pristine) to 1 (fully scraped), null when unknown @example 0.57
  """
  wear: String
}

