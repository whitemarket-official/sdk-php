  """
  Seconds the buyer must still wait before cancelling, null when cancelling is unavailable or already allowed @example 1800
  """
  cancelByBuyerNeedWait: Int

  """When the deal was created @example 2023-11-29T23:33:27+0000"""
  createdAt: DateTime!

  """Your own reference passed when the deal was created @example my_id_42"""
  customId: String

  """How the item is handed over: by bot or by the seller @example AUTO"""
  deliveryType: DeliveryType!

  """
  Deadline to complete the deal before it is cancelled @example 2023-11-29T23:33:27+0000
  """
  expiredAt: DateTime!

  """
  Shared by deals bought in one action; null for a standalone deal @example 1ee796f9-f855-630e-8e7e-0242ac160005
  """
  groupId: String

  """Deal ID @example 1ee796f9-f855-630e-8e7e-0242ac160005"""
  id: String!

  """Whether the buyer may still cancel at the current status @example true"""
  isCancelByBuyerSupported: Boolean!

  """
  Whether Steam holds the trade until settlementTimeAt before funds are released @example true
  """
  isTradeProtected: Boolean!

  """Item being transferred, with its float, pattern and stickers"""
  item: InventoryItemInterface

  """
  ID of the limit order that triggered this deal, if any @example 1ee796f9-f855-630e-8e7e-0242ac160005
  """
  orderId: String

  """
  Deal amount: net of the fee for the seller, after discount for the buyer
  """
  price: Money!

  """Listing this deal was made from, as it looked at purchase time"""
  product: MarketProductHistory!

  """Steam account the trade offer is sent to"""
  receiver: PersonSteam!

  """
  Trade URL to send the offer to. Filled only for the side that must send it @example https://steamcommunity.com/tradeoffer/new/?partner=100000001&token=abcd1234
  """
  receiverTradeUrl: String

  """User the item is bought from"""
  seller: PersonPublic!

  """
  When the Steam trade hold ends and funds are released, null when the deal is not trade-protected @example 2023-11-29T23:33:27+0000
  """
  settlementTimeAt: DateTime

  """
  Where the deal currently stands in the trade flow @example BUYER_OFFERED
  """
  status: MarketDealStatus!

  """Steam trade offer ID, set once the offer is sent @example 6795949861"""
  steamId: String

  """Payout for the whole instant-sell group; null outside such deals"""
  totalPrice: Money

  """
  Steam trade ID, set once the offer is accepted @example 825964796568440469
  """
  tradeId: String
}

