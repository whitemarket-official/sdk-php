"""Represent date & time @example 2023-11-14T13:34:36+0000"""
scalar DateTime

"""DateTime range"""
input DateTimeRangeInput {
  """Point from @example 2023-11-29T23:33:27+0000"""
  from: DateTime

  """Point to @example 2023-11-29T23:33:27+0000"""
