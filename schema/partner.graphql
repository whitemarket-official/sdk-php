type CSGOCharm {
  """Charm gradient colors from CSROI dataset"""
  gradient: CSGOCharmGradient

  """
  Image of charm @example https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGI6zwki4Uf_a0IW2MHqH6lhKpcj_6WbwURPOi4Xwwihe-PeiJqA6dvPDD2XAmL4i47ZtHyuxxU5_tWTcyYqvcymVawEnWZNxEeAMtEWm0oqw8L2NeF4
  """
  icon(height: Int, width: Int): String

  """Charm min price"""
  minPrice: Money

  """Mnemonic name of charm @example usp_jewel_0"""
  name: String!

  """Charm pattern (paint seed) @example 55123"""
  pattern: Int

  """Title of charm @example Charm | Glamour Shot"""
  title: String!
}

type CSGOCharmGradient {
  """Gradient color points in CSROI dataset order"""
  points: [CSGOCharmGradientPoint!]!

  """
  CSROI YouTube video url with timecode of this pattern @example https://youtu.be/XsEMnb6a3oE?t=28
  """
  youtubeLink: String
}

type CSGOCharmGradientPoint {
  """Hex color @example #A26F58"""
  color: String!

  """Gradient zone label from CSROI @example Center Blade"""
  name: String
}

enum CSGOExterior {
  BATTLE_SCARED
  FACTORY_NEW
  FIELD_TESTED
  MINIMAL_WEAR
  NOT_PAINTED
  WELL_WORN
}

type CSGOInventoryItem implements InventoryItemInterface {
  """Amount @example 1"""
  amount: Int!

  """The ID of the app which owns the item @example 730"""
  appId: String!

  """Steam Asset ID @example 34070244882"""
  assetId: String!

  """Can item sold via instant sell"""
  canInstantSell: Boolean

  """Gradient colors for standalone charm items (null for non-charm items)"""
  charmGradient: CSGOCharmGradient

  """Charms"""
  charms: [CSGOCharm]

  """The first half of the item cache identifier @example 5568220466"""
  classId: String!

  """Steam Context ID @example 2"""
  contextId: String!

  """Is on deal"""
  deal: MarketDeal

  """Description of item"""
  description: SteamItemInterface

  """Exterior enum value"""
  exteriorEnum: CSGOExterior

  """Fade percentage (80.0–100.0), null for non-fade skins @example 95.13"""
  fade: Float

  """
  Fade rank (1 = best or worst, higher = more mid), null for non-fade skins @example 234
  """
  fadeRank: Int

  """Float value @example 0.3169"""
  float: String

  """Item ID @example 1ee7cfde-8f2a-697e-8118-0242ac17000a"""
  id: String!

  """The second half of the item cache identifier @example 188530139"""
  instanceId: String!

  """Price for instant sell"""
  instantSellPrice: Money

  """
  Is additional params missed, for example float value or stickers @example true
  """
  isAdditionalDataMissed: Boolean!

  """Is stickers info missed @example true"""
  isStickersDataMissed: Boolean!

  """
  Inspect link @example steam://rungame/730/76561202255233023/+csgo_econ_action_preview%20S76561199554039019A34295908728D14702216662888361045
  """
  link: String

  """Max price for sell"""
  maxPriceForSell: Money

  """Min price in catalog"""
  minPrice: Money

  """Name hash of item"""
  nameHash: String

  """Matched order info"""
  order: MarketOrderPublic

  """Finish catalog @example 46"""
  paintIndex: String

  """Pattern Template @example 730"""
  paintSeed: String
  phase: String

  """Phase enum value"""
  phaseEnum: CSGOPhase

  """Is on sale"""
  product: MarketProduct

  """
  Price the owner paid for this item on WhiteMarket. Null for items not bought on WhiteMarket or when viewed by non-owner
  """
  purchasePrice: Money

  """
  Whether the recommended price is higher or lower than the purchase price. Null when either price is missing
  """
  purchasePriceIndicator: PriceIndicator

  """Recommended price for sell"""
  recommendedPrice: Money

  """
  Seller steam ID. Please contact support for this feature @example 76561199387616956
  """
  sellerSteamId: String

  """Qty of similar items in inventory @example 42"""
  similarQty: Int

  """Stickers titles @example Sticker | SK Gaming (Gold) | Atlanta 2017"""
  stickerTitles: [String] @deprecated(reason: "Use stickers.title instead")

  """Stickers"""
  stickers: [CSGOSticker]

  """Updated at @example 2023-11-29T23:33:27+0000"""
  updatedAt: DateTime!
}

type CSGOMarketOrder implements MarketOrder {
  """The ID of the app which owns the item @example 730"""
  app: SteamApp!

  """Comment to order"""
  comment: String

  """Created at @example 2023-11-29T23:33:27+0000"""
  createdAt: DateTime!

  """Expired at @example 2023-11-29T23:33:27+0000"""
  expiredAt: DateTime
  exterior: CSGOExterior

  """
  Normal icon @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
  """
  icon(height: Int, width: Int): String

  """
  Large icon @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
  """
  iconLarge(height: Int, width: Int): String

  """Order ID @example 1ee4bd8c-e669-695e-9ba4-0242ac1d0008"""
  id: String!

  """
  External trade URL for delivery @example https://steamcommunity.com/tradeoffer/new/?partner=272985700&token=EqWnBOIL
  """
  link: String

  """Hash name @example Sealed Graffiti | Loser (SWAT Blue)"""
  nameHash: String!

  """Price"""
  params: [MarketOrderParamValue!]!
  phase: CSGOPhase

  """Price"""
  price: Money!

  """Quantity of products @example 10"""
  quantity: Int!

  """Quantity of failed deals @example 10"""
  quantityFailed: Int!

  """Quantity of in progress deals @example 10"""
  quantityProgress: Int!

  """Quantity of success deals @example 10"""
  quantitySuccess: Int!
  rarity: CSGORarity
  short: String
  skin: String

  """Status @example ACTIVE"""
  status: MarketOrderStatus!
}

type CSGOMarketOrderPublic implements MarketOrderPublic {
  """The ID of the app which owns the item @example 730"""
  app: SteamApp!
  category: CSGOCategory
  exterior: CSGOExterior

  """
  Normal icon @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
