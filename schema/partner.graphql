"""A charm attached to a weapon, with its own pattern"""
type CSGOCharm {
  """Colors this pattern shows, null when the pattern is not catalogued"""
  gradient: CSGOCharmGradient

  """
  Icon of the charm @example https://community.akamai.steamstatic.com/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGI6zwki4Uf_a0IW2MHqH6lhKpcj_6WbwURPOi4Xwwihe-PeiJqA6dvPDD2XAmL4i47ZtHyuxxU5_tWTcyYqvcymVawEnWZNxEeAMtEWm0oqw8L2NeF4
  """
  icon(height: Int, width: Int): String

  """Cheapest listing of this charm as a standalone item"""
  minPrice: Money

  """Catalog key of the charm @example usp_jewel_0"""
  name: String!

  """Charm pattern (paint seed) @example 55123"""
  pattern: Int

  """Display title of the charm @example Charm | Glamour Shot"""
  title: String!
}

"""Colors catalogued for one charm pattern"""
type CSGOCharmGradient {
  """Gradient color points, in catalogue order"""
  points: [CSGOCharmGradientPoint!]!

  """
  YouTube video url with a timecode of this pattern @example https://youtu.be/XsEMnb6a3oE?t=28
  """
  youtubeLink: String
}

"""One colored zone of a charm pattern"""
type CSGOCharmGradientPoint {
  """Hex color @example #A26F58"""
  color: String!

  """Label of the gradient zone @example Center Blade"""
  name: String
}

enum CSGOExterior {
  BATTLE_SCARED
  FACTORY_NEW
  FIELD_TESTED
  MINIMAL_WEAR
  NOT_PAINTED
  WELL_WORN
}

"""
One specific item copy in a Steam inventory, with its own wear and pattern
"""
type CSGOInventoryItem implements InventoryItemInterface {
  """How many copies this stack holds @example 1"""
  amount: Int!

  """The ID of the app which owns the item @example 730"""
  appId: String!

  """Steam id of this exact copy in the inventory @example 34070244882"""
  assetId: String!

  """Whether the item can be sold instantly at our price @example true"""
  canInstantSell: Boolean

  """Gradient colors for standalone charm items (null for non-charm items)"""
  charmGradient: CSGOCharmGradient

  """Charms attached to this copy"""
  charms: [CSGOCharm]

  """
  Steam class id; with instanceId it forms the item ACI id @example 5568220466
  """
  classId: String!

  """Inventory section inside the app, 2 for CS2 @example 2"""
  contextId: String!

  """Deal this item is locked in, null when it is free"""
  deal: MarketDeal

  """Catalog card shared by every copy of this item"""
  description: SteamItemInterface

  """Wear grade this copy falls into by its float"""
  exteriorEnum: CSGOExterior

  """Fade percentage (80.0–100.0), null for non-fade skins @example 95.13"""
  fade: Float

  """
  Fade rank (1 = best or worst, higher = more mid), null for non-fade skins @example 234
  """
  fadeRank: Int

  """Wear of this copy, from 0 (pristine) to 1 (battered) @example 0.3169"""
  float: String

  """
  Internal id of this inventory record @example 1ee7cfde-8f2a-697e-8118-0242ac17000a
  """
  id: String!

  """
  Steam instance id; with classId it forms the item ACI id @example 188530139
  """
  instanceId: String!

  """What we pay for an instant sale, null when we do not buy it"""
  instantSellPrice: Money

  """Whether wear, pattern or sticker data is still missing @example true"""
  isAdditionalDataMissed: Boolean!

  """Whether sticker data in particular is still missing @example true"""
  isStickersDataMissed: Boolean!

  """
  Steam inspect link that opens this exact copy in game @example steam://rungame/730/76561198000000000/+csgo_econ_action_preview%20S76561198000000000A10000000001D10000000000000000001
  """
  link: String

  """
  Highest price accepted when listing this item, null without a reference price
  """
  maxPriceForSell: Money

  """Cheapest listing of the same item right now, null when none is on sale"""
  minPrice: Money

  """
  Steam market name shared by every copy of this item @example AK-47 | Redline (Field-Tested)
  """
  nameHash: String

  """Buy order this item could fill, null when none matches"""
  order: MarketOrderPublic

  """Number of the finish in the game catalog @example 46"""
  paintIndex: String

  """Pattern seed fixing how the texture landed, 0 to 1000 @example 730"""
  paintSeed: String

  """Doppler phase as plain text, kept for older clients @example Phase 2"""
  phase: String

  """Doppler phase, null for skins that have no phases"""
  phaseEnum: CSGOPhase

  """Listing this item is on sale under, null when it is not listed"""
  product: MarketProduct

  """
  Price the owner paid on WhiteMarket, null for items bought elsewhere or when hidden from non-owners
  """
  purchasePrice: Money

  """
  Whether the recommended price is higher or lower than the purchase price. Null when either price is missing
  """
  purchasePriceIndicator: PriceIndicator

  """Price we suggest listing at, null when we cannot suggest one"""
  recommendedPrice: Money

  """
  Steam account of the seller, available only to callers granted access @example 76561198000000000
  """
  sellerSteamId: String

  """How many copies of the same item the inventory holds @example 42"""
  similarQty: Int

  """
  Titles of the stickers applied to this copy @example ["Sticker | SK Gaming (Gold) | Atlanta 2017"]
  """
  stickerTitles: [String] @deprecated(reason: "Use stickers.title instead")

  """Stickers applied to this copy, in weapon slot order"""
  stickers: [CSGOSticker]

  """
  When this copy was last seen in the inventory @example 2023-11-29T23:33:27+0000
  """
  updatedAt: DateTime!
}

"""Buy order for a CS2 item, with the traits the wanted item must have"""
type CSGOMarketOrder implements MarketOrder {
  """Steam app the wanted item belongs to @example 730"""
  app: SteamApp!

  """
  Note left when the order was stopped @example Item is not available anymore
  """
  comment: String

  """When the order was placed @example 2023-11-29T23:33:27+0000"""
  createdAt: DateTime!

  """
  When the order stops hunting; null means no deadline @example 2023-11-29T23:33:27+0000
  """
  expiredAt: DateTime

  """Wear grade the wanted item must have, null when any fits"""
  exterior: CSGOExterior

  """
  Item icon, resized to width and height when given @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
  """
  icon(height: Int, width: Int): String

  """
  Larger item icon, resized to width and height when given @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
  """
  iconLarge(height: Int, width: Int): String

  """Order ID @example 1ee4bd8c-e669-695e-9ba4-0242ac1d0008"""
  id: String!

  """
  Trade URL bought items are delivered to @example https://steamcommunity.com/tradeoffer/new/?partner=100000001&token=abcd1234
  """
  link: String

  """
  Steam market hash name of the wanted item @example Sealed Graffiti | Loser (SWAT Blue)
  """
  nameHash: String!

  """Conditions an item must match to fill the order"""
  params: [MarketOrderParamValue!]!

  """Doppler phase the wanted item must have, null when any fits"""
  phase: CSGOPhase

  """Most the buyer will pay per item"""
  price: Money!

  """How many items the order asks for in total @example 10"""
  quantity: Int!

  """Items whose deal fell through and are back on the market @example 10"""
  quantityFailed: Int!

  """Items with a deal currently running @example 10"""
  quantityProgress: Int!

  """Items already bought and delivered @example 10"""
  quantitySuccess: Int!

  """Rarity grade of the wanted item, null when unknown"""
  rarity: CSGORarity

  """Weapon part of the name, before the bar @example AK-47"""
  short: String

  """Skin part of the name, after the bar @example Redline"""
  skin: String

  """
  Whether the order still hunts for items, or why it stopped @example ACTIVE
  """
  status: MarketOrderStatus!
}

"""Buy order for a CS2 item as shown to everyone, without buyer details"""
type CSGOMarketOrderPublic implements MarketOrderPublic {
  """Steam game the wanted item belongs to @example 730"""
  app: SteamApp!

  """Catalog section of the wanted item"""
  category: CSGOCategory

  """Wear grade the wanted item must have, null when any fits"""
  exterior: CSGOExterior

  """
  Item icon, resized to width and height when given @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
  """
  icon(height: Int, width: Int): String

  """
  Larger item icon, resized to width and height when given @example https://steamcdn-a.akamaihd.net/apps/730/icons/econ/stickers/paris2023/sig_floppy_large.a2063e888511d11f9ef153ddb3b705bf3f8acdfe.png
  """
  iconLarge(height: Int, width: Int): String

  """Order id @example 1ee4bd8c-e669-695e-9ba4-0242ac1d0008"""
  id: String!

  """
  Item of the caller that would fill this order, null when they have none
  """
  inventory: InventoryItemInterface

  """Whether the order belongs to the current user @example true"""
  isMy: Boolean!

  """Whether the wanted item must be a Souvenir drop @example false"""
  isSouvenir: Boolean

  """Whether the wanted weapon must carry a StatTrak module @example true"""
  isStatTrak: Boolean

  """
  Steam market name of the wanted item @example Sealed Graffiti | Loser (SWAT Blue)
  """
  nameHash: String!

  """Extra conditions the item must satisfy, such as wear or phase"""
  params: [MarketOrderParamValue!]!

  """Price the buyer pays per copy"""
  price: Money!

  """How many copies the buyer still wants @example 42"""
  quantity: Int!

  """Rarity grade of the wanted item, null when unknown"""
  rarity: CSGORarity

  """Weapon part of the name, before the bar @example AK-47"""
  short: String

  """Skin part of the name, after the bar @example Redline"""
  skin: String

  """Catalog subsection of the wanted item"""
  subcategory: CSGOSubcategory
}

enum CSGOPhase {
  BLACK_PEARL
  EMERALD
  PHASE1
  PHASE2
  PHASE3
  PHASE4
  RUBY
  SAPPHIRE
}

enum CSGORarity {
  ANCIENT
  ANCIENT_CHARACTER
  ANCIENT_WEAPON
  COMMON
