  Normal icon @example https:\/\/steamcdn-a.akamaihd.net\/apps\/730\/icons\/econ\/default_generated\/weapon_ak47_cu_ak47_rubber_light_large.5836c38d3037a5a1f90ffdc8c9d0b94367ca8efd.png
