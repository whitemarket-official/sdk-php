"""Achievement param"""
type AchievementBooleanParam {
  name: AchievementParamType!
  value: Boolean!
}

enum AchievementParamType {
  CONDITION_BUY_GLOVES
  CONDITION_BUY_KNIFE
  CONDITION_BUY_PISTOL
  CONDITION_BUY_SMG_OR_RIFLE
  CONDITION_FULFILLED_TRADE_AMOUNT
  CONDITION_TRADE_AMOUNT
}

union AchievementParamUnion = AchievementBooleanParam | AchievementStringParam

enum AchievementStatusType {
  COMPLETED
  IN_PROGRESS
  MISSED
  NOT_STARTED
}

"""Achievement param"""
type AchievementStringParam {
  name: AchievementParamType!
  value: String!
}

