schema {
  query: PartnerQuery
  mutation: PartnerMutation
}

"""Achievement counter whose value is a yes or no flag"""
type AchievementBooleanParam {
  """Which counter of the achievement this is"""
  name: AchievementParamType!

  """Whether the condition behind the counter is met @example true"""
  value: Boolean!
}

enum AchievementParamType {
  CONDITION_BUY_GLOVES
  CONDITION_BUY_KNIFE
  CONDITION_BUY_PISTOL
  CONDITION_BUY_SMG_OR_RIFLE
  CONDITION_FULFILLED_TRADE_AMOUNT
  CONDITION_TRADE_AMOUNT
}

union AchievementParamUnion = AchievementBooleanParam | AchievementStringParam

enum AchievementStatusType {
  COMPLETED
  IN_PROGRESS
  MISSED
  NOT_STARTED
}

"""Achievement counter whose value is text or a number"""
type AchievementStringParam {
  """Which counter of the achievement this is"""
  name: AchievementParamType!

  """Value reached so far, read it by the counter name @example 250"""
  value: String!
}

enum AchievementType {
  COMBO_WOMBO
  ENTRY_FRAG
  FEBRUARY_MARCH_24_ELITE_TRADER
  FIRST_SELL
  FIRST_STEPS
  FORCE_BUY
  FULL_BUY
  JUNE_23_ELITE_TRADER
  KNIFE_KILL
  MOBILE_DEFUSE_KIT
  PRO_TRADER
  SAFE_HANDS
  SEPTEMBER_23_ELITE_TRADER
  VERIFIED_USER
}

enum AchievementTypeType {
  ACTION
  CHECKLIST
  LIMIT
  PROGRESS
}

"""Token issued after a successful sign-in"""
type AuthTokens {
  """Short-lived JWT to send in the Authorization header @example <JWT>"""
  accessToken: String!

  """Whether this sign-in created a brand new account @example true"""
  isNewPerson: Boolean!
}

enum AvatarType {
  AVATAR_1
  AVATAR_2
  AVATAR_3
  AVATAR_4
  AVATAR_5
  AVATAR_6
  AVATAR_7
  AVATAR_8
  AVATAR_9
  AVATAR_10
  AVATAR_11
  AVATAR_12
  CUSTOM
  STEAM
}

enum BannerType {
  BANNER_1
  BANNER_2
  BANNER_3
  BANNER_4
  BANNER_5
  BANNER_6
  BANNER_7
  BANNER_8
