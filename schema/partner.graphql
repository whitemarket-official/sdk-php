  """
  iconLarge(height: Int, width: Int): String

  """Order ID @example 1ee4bd8c-e669-695e-9ba4-0242ac1d0008"""
  id: String!

  """Item info"""
  inventory: InventoryItemInterface

  """Is your order or not @example true"""
  isMy: Boolean!
  isSouvenir: Boolean
  isStatTrak: Boolean

  """Hash name @example Sealed Graffiti | Loser (SWAT Blue)"""
  nameHash: String!

  """Price"""
  params: [MarketOrderParamValue!]!

  """Price"""
  price: Money!

  """Quantity of products @example 42"""
  quantity: Int!
  rarity: CSGORarity
  short: String
  skin: String
  subcategory: CSGOSubcategory
}

