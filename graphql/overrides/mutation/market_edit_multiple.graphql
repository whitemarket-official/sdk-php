# Hand-written override (SDK_SPEC 1.2): the server fails `updatedAt` of a deal's product item (`MarketProductHistory.params`)
# with "Internal error occurred" and `params.order { id }` with HTTP 500, and rolls a mutation back when it does:
# `market_buy` created no deal [observed 2026-11-02, twice]. Dropped there: `updatedAt` (the CSGOInventoryItemFields
# leaves are inlined without it) and `order`. Pinned by tests/unit/Generated/ProductHistoryParamsSelectionTest.php.
mutation MarketEditMultiple($items: [MarketProductEditInput!]!) {
  market_edit_multiple(items: $items) {
    ...MarketProductResultFields
    product {
      __typename
      ... on MarketProduct {
        ...MarketProductFields
        discountPrice {
          ...MoneyFields
        }
        item {
          __typename
          ... on CSGOInventoryItem {
            ...CSGOInventoryItemFields
            deal {
              id
            }
            order {
              __typename
              id
            }
            product {
              id
            }
          }
        }
        offerMinPrice {
          ...MoneyFields
        }
        position {
          ...IntegerRangeFields
        }
        price {
          ...MoneyFields
        }
        promo {
          ...PromoFields
        }
        store {
          ...PersonStoreFields
        }
      }
      ... on MarketProductHistory {
        ...MarketProductHistoryFields
        description {
          __typename
          ... on CSGOSteamItem {
            ...CSGOSteamItemFields
          }
        }
        params {
          __typename
          ... on CSGOInventoryItem {
            amount
            appId
            assetId
            canInstantSell
            classId
            contextId
            exteriorEnum
            fade
            fadeRank
            float
            id
            instanceId
            isAdditionalDataMissed
            isStickersDataMissed
            link
            nameHash
            paintIndex
            paintSeed
            phase
            phaseEnum
            purchasePriceIndicator
            sellerSteamId
            similarQty
            deal {
              id
            }
            product {
              id
            }
          }
        }
        price {
          ...MoneyFields
        }
        store {
          ...PersonStoreFields
        }
      }
    }
  }
}
