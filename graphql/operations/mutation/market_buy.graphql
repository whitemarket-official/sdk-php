# Hand-written override (SDK_SPEC 1.2): the server fails `updatedAt` of a deal's product item (`MarketProductHistory.params`)
# with "Internal error occurred" and `params.order { id }` with HTTP 500, and rolls a mutation back when it does:
# `market_buy` created no deal [observed 2026-11-02, twice]. Dropped there: `updatedAt` (the CSGOInventoryItemFields
# leaves are inlined without it) and `order`. Pinned by tests/unit/Generated/ProductHistoryParamsSelectionTest.php.
mutation MarketBuy($appIdAssetIdInput: MarketProductAppIdAssetIdInput, $appIdNameHashInput: MarketProductAppIdNameHashInput, $customId: String, $deliveryPromise: DeliveryPromise, $deliveryType: DeliveryType, $id: Uuid, $link: SteamLinkInput, $maxPriceInput: MoneyInput) {
  market_buy(
    appIdAssetIdInput: $appIdAssetIdInput
    appIdNameHashInput: $appIdNameHashInput
    customId: $customId
    deliveryPromise: $deliveryPromise
    deliveryType: $deliveryType
    id: $id
    link: $link
    maxPriceInput: $maxPriceInput
  ) {
    ...MarketDealFields
    buyer {
      ...PersonPublicFields
    }
    item {
      __typename
      ... on CSGOInventoryItem {
        ...CSGOInventoryItemFields
        charmGradient {
          ...CSGOCharmGradientFields
        }
        charms {
          ...CSGOCharmFields
        }
        deal {
          ...MarketDealFields
          buyer {
            id
          }
          item {
            __typename
            id
          }
          product {
            id
          }
          seller {
            id
          }
        }
        description {
          __typename
          ... on CSGOSteamItem {
            ...CSGOSteamItemFields
          }
        }
        instantSellPrice {
          ...MoneyFields
        }
        maxPriceForSell {
          ...MoneyFields
        }
        minPrice {
          ...MoneyFields
        }
        order {
          __typename
        }
        product {
          ...MarketProductFields
          item {
            __typename
            id
          }
          store {
            id
          }
        }
        purchasePrice {
          ...MoneyFields
        }
        recommendedPrice {
          ...MoneyFields
        }
        stickers {
          ...CSGOStickerFields
        }
      }
    }
    price {
      ...MoneyFields
    }
    product {
      ...MarketProductHistoryFields
      description {
        __typename
        ... on CSGOSteamItem {
          ...CSGOSteamItemFields
        }
      }
      params {
        __typename
        ... on CSGOInventoryItem {
          amount
          appId
          assetId
          canInstantSell
          classId
          contextId
          exteriorEnum
          fade
          fadeRank
          float
          id
          instanceId
          isAdditionalDataMissed
          isStickersDataMissed
          link
          nameHash
          paintIndex
          paintSeed
          phase
          phaseEnum
          purchasePriceIndicator
          sellerSteamId
          similarQty
          deal {
            id
          }
          product {
            id
          }
        }
      }
      price {
        ...MoneyFields
      }
      store {
        ...PersonStoreFields
      }
    }
    receiver {
      ...PersonSteamFields
    }
    seller {
      ...PersonPublicFields
    }
    totalPrice {
      ...MoneyFields
    }
  }
}
